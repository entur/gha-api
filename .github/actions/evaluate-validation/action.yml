name: 'Evaluate validation for gha-api'
description: 'Note: Only for use within gha-api.'
inputs:
  token:
    description: "Github token"
    required: true
  validation_successful:
    description: "If the validation call succeeded or not"
    required: true
  validation_result:
    description: "The validation result from api-spec-registry"
    required: true
  changelog_dir:
    description: "Changelog directory"
    required: true
  show_changes:
    description: "Which changes to show in comment."
    required: true
  fail_on_breaking_changes:
    description: "Should the workflow fail if there are breaking changes. true/false"
    required: true
outputs:
  changes_detected:
    description: "Did the run detect any changes"
  breaking_changes_detected:
    description: "Did the run detect any breaking changes"
  comment_url:
    description: "Url to created change comment, if any."

runs:
  using: 'node24'
  main: 'dist/index.cjs'