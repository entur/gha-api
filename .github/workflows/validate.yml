name: Entur/API/Validate

on:
  workflow_call:
    inputs:
      path:
        description: "Path to OpenAPI specification"
        type: string
      changelog_dir:
        description: "Path to the changelog entries for this API"
        type: string
      artifact:
        description: "Artifact containing the OpenAPI specification."
        type: string
      env:
        description: "The environment to operate against. dev|prd. Default: prd"
        type: string
        default: prd
      show_changes:
        description: "Should the workflow create a PR comment showing the changes made to the specification? Values: \"all\": Show all changes. \"breaking\": Only show breaking changes. \"none\": Don't show changes. Default: \"all\""
        type: string
        default: all
      fail_on_breaking_changes:
        type: boolean
        default: false

jobs:
  validate-spec:
    name: OpenAPI Validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write # required for creating comments on pull requests
    env:
      GHA_API_ARTIFACT:           ${{ inputs.artifact }}
      GHA_API_PATH:               ${{ inputs.path }}
      GHA_API_CHANGELOG_DIR:      ${{ inputs.changelog_dir }}
      GHA_API_ENV:                ${{ inputs.env }}
      GHA_API_SHOW_CHANGES:       ${{ inputs.show_changes }}
      GHA_API_CLOUD_RUN_ENDPOINT: https://europe-west1-ent-apidata-${{ inputs.env }}.cloudfunctions.net/publish-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download artifact (if artifact provided)
        if: ${{ inputs.artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact }}
          path: /tmp/artifacts
      - name: Validate inputs
        run: |
          # Print every statement if debugging
          [ -n "${{ runner.debug }}" ] && set -x
          set -euo pipefail
          
          # Validate fail_threshold
          case "$GHA_API_ENV" in
            dev|prd) 
              ;;  # OK
            *) 
              echo "::error::env must be one of: dev, prd"
              exit 1
              ;;
          esac

          # Validate show_changes
          case "$GHA_API_SHOW_CHANGES" in
            all|breaking|none) 
              ;;  # OK
            *) 
              echo "::error::show_changes must be one of: all, breaking, none."
              exit 1
              ;;
          esac
      - name: Resolve spec path
        id: resolve-spec-path
        run: |
          # Resolve spec path based on inputs
          if [ -n "$GHA_API_ARTIFACT" ]; then
            if [ -n "$GHA_API_PATH" ]; then
              spec_path="/tmp/artifacts/$GHA_API_PATH"
            else
              spec_path="/tmp/artifacts/openapi.yaml"
            fi
          else
            if [ -n "$GHA_API_PATH" ]; then
              spec_path="$GHA_API_PATH"
            else
              spec_path="specs/openapi.yaml"
            fi
          fi

          echo "Path to spec resolved to $spec_path"

          if [ ! -f $spec_path ]; then
            echo "File $spec_path not found."
            exit 1
          fi

          echo "spec_path=$spec_path" >> "$GITHUB_OUTPUT"
      - name: Resolve changelog dir
        id: resolve-changelog-dir
        run: |
          # Resolve changelog dir based on inputs
          if [ -n "$GHA_API_CHANGELOG_DIR" ]; then
            changelog_dir=$GHA_API_CHANGELOG_DIR
            if [ ! -d $changelog_dir ]; then
              echo "Directory $changelog_dir not found."
              exit 1
            fi

            echo "changelog_dir=$changelog_dir" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$GHA_API_ARTIFACT" ]; then
              changelog_dir="specs/changelog"
            else
              if [ -n "$GHA_API_PATH" ]; then
                spec_dir=$(dirname $GHA_API_PATH)
                changelog_dir="$spec_dir/changelog"
              else
                changelog_dir="specs/changelog"
              fi
            fi

            echo "Path to changelogs resolved to $changelog_dir"

            if [ -d $changelog_dir ]; then
              echo "changelog_dir=$changelog_dir" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.GHA_API_CLOUD_RUN_ENDPOINT }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Checkout linting rulesets
        uses: actions/checkout@v7
        with:
          repository: entur/api-guidelines
          ref: v3.5.0
          path: rulesets
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .spectral-required.yml
            functions/*.js
      - uses: $/.github/actions/setup-spectral
        name: Setup spectral
      - uses: $/.github/actions/setup-redocly
        name: Setup redocly
      - name: Validate
        shell: bash
        id: validate
        env:
          GHA_API_PATH:          ${{ steps.resolve-spec-path.outputs.spec_path }}
          GHA_API_CHANGELOG_DIR: ${{ steps.resolve-changelog-dir.outputs.changelog_dir }}
          ID_TOKEN:              ${{ steps.auth.outputs.id_token }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          shopt -s globstar

          echo "Validating spec: $GHA_API_PATH"

          echo "Linting with minimal ruleset..."
          if ! spectral lint "$GHA_API_PATH" --ruleset "rulesets/.spectral-required.yml"; then
            echo "::error::Spec validation failed. Failing workflow."
            exit 1
          fi

          echo "Bundling..."
          filename=$(basename $GHA_API_PATH)
          mkdir -p /tmp/specs
          redocly bundle -o /tmp/specs/$filename $GHA_API_PATH

          # Extract repository name (without owner)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          # Create metadata JSON
          METADATA="{\"repository\": \"$REPO_NAME\", \"github\": { \"sha\": \"$GITHUB_SHA\", \"ref\": \"$GITHUB_REF\", \"runId\": \"$GITHUB_RUN_ID\" }}"

          # Attach each .md file in the top level of the changelog dir as a "changelog" part
          CHANGELOG_ARGS=()
          if [ -n "$GHA_API_CHANGELOG_DIR" ] && [ -d "$GHA_API_CHANGELOG_DIR" ]; then
            while IFS= read -r -d '' file; do
              echo "Including changelog: $file"
              CHANGELOG_ARGS+=(-F "changelog=@$file")
            done < <(find "$GHA_API_CHANGELOG_DIR" -maxdepth 1 -type f -name '*.md' -print0 | sort -z)
          fi

          echo "Uploading to api-spec-registry with dryRun=true..."

          RESPONSE=$(curl --fail-with-body -sS \
            -X PUT \
            -H "Authorization: Bearer $ID_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "spec=@/tmp/specs/$filename" \
            "${CHANGELOG_ARGS[@]}" \
            "$GHA_API_CLOUD_RUN_ENDPOINT?dryRun=true") || {
              echo "successful=false" >> "$GITHUB_OUTPUT"
              echo "result=$RESPONSE" >> "$GITHUB_OUTPUT"
              exit 0
          }
          
          echo "successful=true" >> "$GITHUB_OUTPUT"
          echo "result=$RESPONSE" >> "$GITHUB_OUTPUT"

          echo "Successfully validated: $GHA_API_PATH"
      - name: Evaluate validation result
        uses: $/.github/actions/evaluate-validation
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog_dir: ${{ steps.resolve-changelog-dir.outputs.changelog_dir }}
          validation_successful: ${{ steps.validate.outputs.successful }}
          validation_result: ${{ steps.validate.outputs.result }}
          show_changes: ${{ inputs.show_changes }}
          fail_on_breaking_changes: ${{ inputs.fail_on_breaking_changes }}

      - name: Send analytics
        if: always()
        uses: $/.github/actions/posthog
        with:
          workflow_name:   validate
          workflow_inputs: ${{ toJSON(inputs) }}
          api_key:         "phc_yhR5iXxjC2n6J7tqznFQURld147kruAy4HuYgjbyEyk"

