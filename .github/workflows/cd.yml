name: create release
on:
  push:
    branches:
      - main
permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: read
  id-token: write
jobs:
  test-validate-file:
    uses: ./.github/workflows/validate.yml
    with:
      path: fixture/openapi-good.json
  release:
    uses: entur/gha-meta/.github/workflows/release.yml@v1
  update-lint-doc:
    needs: release
    if: needs.release.outputs.releases_created == 'false'
    uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1
    with:
      commit_default_author: 'github_actions'
      target_branch: 'release-please--branches--main'
      workflow_file: .github/workflows/lint.yml
      readme_file: README-lint.md

  update-publish-doc:
    needs: [release, update-lint-doc]
    if: needs.release.outputs.releases_created == 'false'
    uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1
    with:
      commit_default_author: 'github_actions'
      target_branch: 'release-please--branches--main'
      workflow_file: .github/workflows/publish.yml
      readme_file: README-publish.md
  update-validate-doc:
    needs: [release, update-publish-doc]
    if: needs.release.outputs.releases_created == 'false'
    uses: entur/gha-meta/.github/workflows/auto-doc.yml@v1
    with:
      commit_default_author: 'github_actions'
      target_branch: 'release-please--branches--main'
      workflow_file: .github/workflows/validate.yml
      readme_file: README-validate.md
